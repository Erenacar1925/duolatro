image: gradle:8.14.2-jdk21

stages:
  - build
  - test
  - deploy

build-job:
  stage: build
  script:
    - ./gradlew build

run-test:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    reports:
      junit: build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
    when: always

deploy-prod:
  stage: deploy
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
  environment: production